# conda env update -f environment.yml --prune
name: YT-Validator
channels:
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - conda-forge
dependencies:
  - python=3.11
  - google-api-python-client
  # Bounded to match autogluon 1.5.0's own requirements. Left unpinned, conda
  # resolves to the newest release: pandas 3.0 removed the `downcast` argument
  # that autogluon's fillna generator still passes, so the service crash-loops
  # on `TypeError: NDFrame.fillna() got an unexpected keyword argument
  # 'downcast'`. The upper bounds are what makes this file reproducible over
  # time rather than "whatever was current on build day".
  - pandas>=2.0.0,<2.4.0
  - numpy>=1.25.0,<2.4.0
  - tqdm
  - python-dotenv
  - flask
  - pip
  - pip:
      # Pinned to the version that trained trey_pipeline/models/ag_challenger
      - autogluon.tabular[lightgbm,catboost]==1.5.0
      - thefuzz
