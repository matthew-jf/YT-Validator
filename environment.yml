# conda env update -f environment.yml --prune
name: YT-Validator
channels:
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - conda-forge
dependencies:
  - python=3.11
  - scikit-learn>=1.9
  - google-api-python-client
  - pandas
  - numpy
  - tqdm
  - python-dotenv
  - flask
  - pip
  - pip:
      # WESS language predictor (predict_wess.py). On macOS, if the source
      # build fails or predict() raises a numpy-2 copy error, use:
      #   pip install fasttext-wheel "numpy<2"
      - fasttext
